global:
  scrape_interval: 15s

scrape_configs:
  # Aponta pro /metrics de qualquer app usando @herald/gateway (aqui, a PoC em :3000).
  # Formato JSON hoje (InMemoryMetricsCollector) — scrape vai falhar até existir um
  # MetricsCollector com prom-client servindo texto Prometheus nesse mesmo path.
  - job_name: "herald-gateway"
    static_configs:
      - targets: ["host.docker.internal:3000"]
    metrics_path: /metrics

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    # host.docker.internal — Gateway/PoC/Server rodam no host (fora de container), fora do
    # network do compose. extra_hosts torna isso resolvível tanto no Docker Desktop
    # (Mac/Windows/WSL2, onde já funciona nativamente) quanto no Docker "puro" do Linux
    # (onde precisa desse mapeamento explícito pra host-gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: herald
      POSTGRES_PASSWORD: herald
      POSTGRES_DB: herald_server
    ports:
      - "5432:5432"
    volumes:
      - herald_server_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herald"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  herald_server_pgdata:
